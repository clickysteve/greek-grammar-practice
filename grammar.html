<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greek Grammar — Practice</title>
  <link rel="stylesheet" href="suite.css">
  <style>
    :root {
      /* page-specific colours (shared palette comes from suite.css) */
      --read: #45c46a;
      --present: #4ea1ff; --past: #ffd84d; --future: #7fdcff; --pastc: #ff9f43; --futurec: #b78cff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, rgba(255,159,67,.08), transparent 28%), linear-gradient(180deg, #0f1114 0%, #171a1f 100%);
      color: var(--text); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px; }
    h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 16px; letter-spacing: -.03em; }
    button { border: 1px solid var(--border); background: var(--panel2); color: var(--text); border-radius: 10px; font-size: 14px; padding: 9px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { filter: brightness(1.05); }

    /* tabs */
    .g-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .g-tab { font-size: 15px; padding: 10px 16px; border-radius: 12px; }
    .g-tab.active { outline: 2px solid rgba(255,159,67,.45); color: var(--text); background: rgba(255,159,67,.08); }
    .g-tab-due { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--warn); color: #1a1205; font-size: 12px; font-weight: 700; }
    .g-lenrange { width: 150px; accent-color: var(--accent); vertical-align: middle; }
    .g-lenval { font-size: 14px; font-weight: 700; min-width: 22px; text-align: center; display: inline-block; }
    .g-free.active { outline: 2px solid rgba(255,159,67,.45); color: var(--text); }
    .g-spacer-sm { display: inline-block; width: 10px; }

    /* footer data menu */
    .g-footer { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 12px; }
    .g-footer-menu summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; text-transform: uppercase; letter-spacing: .08em; }
    .g-footer-menu summary::-webkit-details-marker { display: none; }
    .g-footer-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .g-footer-row button { font-size: 13px; }
    .g-danger { color: var(--bad); border-color: rgba(255,143,143,.4); }
    .g-danger:hover { border-color: var(--bad); }

    /* full lesson view */
    .g-back { font-size: 13px; margin-bottom: 16px; }
    .g-lesson { border: 1px solid var(--border); border-radius: 20px; background: #12161b; padding: 26px; }
    .g-lesson-title { font-size: clamp(26px, 5vw, 38px); margin: 6px 0 6px; letter-spacing: -.03em; }
    .g-lesson-intro { font-size: 16px; color: var(--muted); margin: 0 0 18px; }
    .g-lesson .g-md-body { font-size: 16px; line-height: 1.65; }
    .g-lesson-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .g-cta-box { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: rgba(255,255,255,.02); }
    .g-cta-h { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
    .g-cta-p { font-size: 14px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
    @media (max-width: 560px) { .g-lesson-cta { grid-template-columns: 1fr; } }

    /* SRS view */
    .g-srsstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
    .g-srsstat { background: #12161b; border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .g-srsstat .n { display: block; font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
    .g-srslist { display: flex; flex-direction: column; gap: 7px; }
    .g-srsrow { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 12px; padding: 10px 14px; background: rgba(255,255,255,.025); cursor: pointer; }
    .g-srsrow:hover { border-color: var(--accent); }
    .g-srsrow.overdue { border-left-color: var(--bad); }
    .g-srsrow.due { border-left-color: var(--warn); }
    .g-srsrow.soon { border-left-color: var(--accent); }
    .g-srsrow.mastered { border-left-color: var(--good); }
    .g-srsrow-main { flex: 1; }
    .g-srsrow-title { font-weight: 600; }
    .g-srsrow-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .g-srsrow-when { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .g-srsrow.overdue .g-srsrow-when { color: var(--bad); }
    .g-srsrow.due .g-srsrow-when { color: var(--warn); }
    .g-srsrow-x { font-size: 12px; padding: 5px 9px; color: var(--muted); }
    .g-srsrow-x:hover { color: var(--bad); border-color: var(--bad); }
    .g-empty { text-align: center; padding: 44px 20px; color: var(--muted); }
    .g-empty-icon { font-size: 44px; }
    .g-empty p { margin: 10px 0 0; }
    .g-empty-sub { font-size: 14px; }
    .g-kindtag { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }

    /* dashboard */
    .g-hero { text-align: center; border: 1px solid var(--border); border-radius: 24px; padding: 28px 20px;
      background: radial-gradient(circle at top, rgba(255,159,67,.10), transparent 50%), #12161b; margin-bottom: 14px; }
    .g-hero-num { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.04em; }
    .g-hero-label { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; margin: 6px 0 16px; }
    .g-summary { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .g-megamix { display: block; width: 100%; margin: 0 0 18px; padding: 14px; font-size: 15px; font-weight: 700;
      background: rgba(255,159,67,.10); border: 1px solid var(--accent); color: var(--accent); border-radius: 14px; }
    .g-megamix:hover { background: rgba(255,159,67,.18); }
    .g-modebar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; font-size: 13px; color: var(--muted); }
    .g-modebar button { font-size: 12px; padding: 7px 11px; }
    .g-modelabel { color: var(--muted); }
    .g-mode.active, .g-len.active, .g-eng.active { outline: 2px solid rgba(255,159,67,.4); color: var(--text); }
    .g-eng { font-size: 12px; }
    .g-spacer { flex: 1; }

    .g-level { margin-bottom: 18px; }
    .g-level-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; cursor: pointer; padding: 4px 2px; border-radius: 10px; }
    .g-level-head:hover { background: rgba(255,255,255,.03); }
    .g-caret { color: var(--muted); font-size: 12px; display: inline-block; width: 12px; }
    .g-level-title { font-weight: 700; font-size: 16px; }
    .g-level-prog { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .g-practice { font-size: 12px; padding: 6px 10px; }
    .g-points { display: flex; flex-direction: column; gap: 8px; }
    .g-point { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-left: 4px solid var(--border);
      border-radius: 12px; padding: 11px 14px; background: rgba(255,255,255,.025); cursor: pointer; }
    .g-point:hover { border-color: var(--accent); }
    .g-point.st-lesson { border-left-color: var(--read); }
    .g-point.st-due { border-left-color: var(--warn); }
    .g-point.st-learning { border-left-color: var(--read); }
    .g-point.st-mastered { border-left-color: var(--good); }
    /* once practised, the side bar reflects accuracy (overrides status colour) */
    .g-point.acc-good { border-left-color: var(--read); }
    .g-point.acc-warn { border-left-color: var(--warn); }
    .g-point.acc-bad { border-left-color: var(--bad); }
    .g-point-main { flex: 1; }
    .g-point-title { font-weight: 600; }
    .g-point-short { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .g-badge { font-size: 11px; color: var(--muted); white-space: nowrap; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; }
    .g-acc { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
    .g-acc.good { color: var(--good); border-color: rgba(142,226,142,.4); }
    .g-acc.warn { color: var(--warn); border-color: rgba(255,216,77,.4); }
    .g-acc.bad { color: var(--bad); border-color: rgba(255,143,143,.4); }
    .g-done-hint { font-size: 12px; color: var(--muted); margin-top: 12px; text-transform: uppercase; letter-spacing: .1em; }
    .g-badge.st-new { color: var(--accent); border-color: var(--accent); }
    .g-badge.st-lesson { color: var(--read); border-color: var(--read); }
    .g-badge.st-due { color: var(--warn); border-color: var(--warn); }
    .g-badge.st-mastered { color: var(--good); border-color: var(--good); }

    /* session */
    .g-session { border: 1px solid var(--border); border-radius: 24px; background: #12161b; padding: 22px; }
    .g-sess-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .g-quit { font-size: 12px; padding: 6px 10px; }
    .g-prompt-point { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 12px; }
    .g-sentence { font-size: clamp(22px, 4vw, 30px); font-weight: 700; line-height: 1.5; letter-spacing: -.01em; }
    .g-blank { color: var(--accent); letter-spacing: 2px; }
    .g-blank-input { font-size: inherit; font-weight: 700; font-family: inherit; width: 220px; max-width: 60vw; text-align: center;
      background: #0e1216; border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 2px 10px; }
    .g-blank-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,159,67,.18); }
    .g-blank-filled { padding: 0 8px; border-radius: 8px; }
    .g-blank-filled.ok { background: rgba(142,226,142,.18); color: var(--good); }
    .g-blank-filled.bad { background: rgba(255,143,143,.18); color: var(--bad); }
    .g-cue { display: inline-block; margin-top: 14px; font-size: 19px; font-weight: 700; color: var(--accent); background: rgba(255,159,67,.10); border: 1px solid rgba(255,159,67,.45); border-radius: 12px; padding: 8px 16px; letter-spacing: -.01em; }
    .g-en { color: var(--muted); font-size: 15px; margin-top: 14px; }
    .g-hint { color: var(--muted); font-size: 13px; margin-top: 6px; font-style: italic; }
    /* verb conjugation dropdown */
    .g-verbdrop { margin-top: 16px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.02); }
    .g-verbdrop summary { cursor: pointer; padding: 10px 14px; font-size: 14px; color: var(--muted); list-style: none; }
    .g-verbdrop summary::-webkit-details-marker { display: none; }
    .g-verbdrop summary::before { content: '▸ '; }
    .g-verbdrop[open] summary::before { content: '▾ '; }
    .g-verbdrop summary strong { color: var(--text); }
    /* conjugation cards, styled like the Verb Memoriser */
    .vm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 4px 14px 4px; }
    .vm-card { border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .vm-card.present { background: color-mix(in srgb, var(--present) 16%, transparent); border-color: color-mix(in srgb, var(--present) 50%, var(--border)); }
    .vm-card.past { background: color-mix(in srgb, var(--past) 16%, transparent); border-color: color-mix(in srgb, var(--past) 50%, var(--border)); }
    .vm-card.future { background: color-mix(in srgb, var(--future) 16%, transparent); border-color: color-mix(in srgb, var(--future) 50%, var(--border)); }
    .vm-card.pastCont { background: color-mix(in srgb, var(--pastc) 16%, transparent); border-color: color-mix(in srgb, var(--pastc) 50%, var(--border)); }
    .vm-card.futureCont { background: color-mix(in srgb, var(--futurec) 16%, transparent); border-color: color-mix(in srgb, var(--futurec) 50%, var(--border)); }
    .vm-k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .vm-row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.08); text-align: left; }
    .vm-row:last-child { border-bottom: 0; }
    .vm-per { color: var(--muted); font-size: 12px; min-width: 56px; }
    .vm-form { font-weight: 600; }
    .g-vlink { display: inline-block; margin: 10px 14px 14px; font-size: 13px; color: var(--accent); }
    /* level accuracy bar — one cell per lesson, coloured by practice accuracy */
    .g-lvbar { display: flex; gap: 2px; height: 9px; margin: 0 2px 12px; }
    .g-lvcell { flex: 1; height: 100%; border-radius: 2px; background: rgba(255,255,255,.06); cursor: pointer; transition: transform .08s, filter .08s; }
    .g-lvcell:hover { transform: scaleY(1.5); filter: brightness(1.25); }
    .g-lvcell.read { background: rgba(255,255,255,.20); }
    .g-lvcell.bad { background: var(--bad); }
    .g-lvcell.warn { background: var(--warn); }
    .g-lvcell.good { background: var(--read); }
    .g-point-go { font-size: 12px; padding: 6px 11px; white-space: nowrap; }
    .g-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .g-choice { text-align: left; font-size: 17px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .g-choice-n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px;
      background: rgba(255,255,255,.06); font-size: 12px; color: var(--muted); }
    .g-type-actions, .g-after { display: flex; gap: 10px; margin-top: 22px; align-items: center; }
    .g-dontknow, .g-explain { font-size: 13px; }
    .g-feedback { margin-top: 20px; font-size: 17px; font-weight: 700; }
    .g-feedback.ok { color: var(--good); }
    .g-feedback.bad { color: var(--bad); }

    .g-done { text-align: center; padding: 50px 20px; }
    .g-done-tick { font-size: 56px; color: var(--good); }
    .g-done-title { font-size: 24px; font-weight: 700; margin-top: 8px; }
    .g-done-sub { color: var(--muted); margin: 8px 0 22px; }

    /* grammar point modal */
    #grammarModal { position: fixed; inset: 0; z-index: 50; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.62); }
    .modal-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(600px, calc(100vw - 32px)); max-height: 86vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; padding: 0; border-radius: 10px; font-size: 18px; }
    .g-md-kicker { font-size: 12px; color: var(--accent); letter-spacing: .14em; font-weight: 700; }
    .g-md-divider { height: 1px; background: var(--border); margin: 18px 0; }
    .g-md-title { margin: 4px 0 14px; font-size: 24px; letter-spacing: -.02em; }
    .g-md-body { font-size: 15px; line-height: 1.6; }
    .g-md-body p { margin: 0 0 12px; }
    .g-md-body em { color: var(--text); font-style: normal; background: rgba(255,255,255,.05); padding: 1px 5px; border-radius: 5px; }
    .g-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 6px 0 14px; font-size: 15px; }
    .g-grid .g-k { color: var(--muted); }
    .g-md-more { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
    .g-md-more p { margin: 0 0 10px; font-size: 15px; line-height: 1.6; }
    .g-md-more em { color: var(--text); font-style: normal; background: rgba(255,255,255,.05); padding: 1px 5px; border-radius: 5px; }
    .g-md-more strong { color: var(--text); }
    .g-tips { margin: 0 0 6px; padding-left: 18px; }
    .g-tips li { margin-bottom: 8px; font-size: 15px; line-height: 1.55; }
    .g-tips li::marker { color: var(--accent); }
    .g-md-ex { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
    .g-md-exh { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 8px; }
    .g-ex { display: flex; flex-direction: column; margin-bottom: 8px; }
    .g-ex-gr { font-size: 16px; }
    .g-ex-en { font-size: 13px; color: var(--muted); }
    .g-md-actions { margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .g-md-note { font-size: 13px; color: var(--muted); }
    .g-md-hint { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
    .g-md-hint strong { color: var(--text); }
  </style>
</head>
