<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greek — Vocabulary Flashcards</title>
  <style>
    :root { --bg:#111315; --panel:#1b1f24; --panel2:#232a31; --text:#eef2f7; --muted:#aab4c0; --border:#36404a; --accent:#ff9f43; --good:#8ee28e; --warn:#ffd84d; --bad:#ff8f8f; --shadow:0 12px 34px rgba(0,0,0,.28); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at top,rgba(255,159,67,.08),transparent 28%),linear-gradient(180deg,#0f1114,#171a1f); color:var(--text); }
    .wrap { max-width:640px; margin:0 auto; padding:24px; }
    .nav { display:flex; gap:12px; margin-bottom:18px; font-size:14px; flex-wrap:wrap; }
    .nav a { color:var(--muted); text-decoration:none; border:1px solid var(--border); padding:7px 12px; border-radius:999px; background:var(--panel2); }
    .nav a:hover { color:var(--text); }
    h1 { font-size:clamp(24px,4vw,34px); margin:0 0 16px; letter-spacing:-.03em; }
    button { border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:10px; font-size:14px; padding:10px 14px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button:disabled { opacity:.4; cursor:default; }
    .btn-primary { background:var(--accent); color:#1a1205; border-color:var(--accent); font-weight:700; }
    .hero { text-align:center; border:1px solid var(--border); border-radius:24px; background:radial-gradient(circle at top,rgba(255,159,67,.10),transparent 50%),#12161b; padding:26px; margin-bottom:16px; }
    .hero-num { font-size:60px; font-weight:800; line-height:1; }
    .hero-label { color:var(--muted); text-transform:uppercase; letter-spacing:.12em; font-size:13px; margin:6px 0 16px; }
    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .summary { text-align:center; color:var(--muted); font-size:14px; margin:10px 0; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:6px; }
    .toolbar .active { outline:2px solid rgba(255,159,67,.45); color:var(--text); }
    .toolbar button { font-size:12px; padding:7px 11px; }

    .card { border:1px solid var(--border); border-radius:24px; background:#12161b; padding:40px 24px; text-align:center; min-height:240px; display:flex; flex-direction:column; justify-content:center; }
    .card-art { font-size:15px; color:var(--muted); }
    .card-front { font-size:clamp(34px,7vw,56px); font-weight:800; letter-spacing:-.03em; }
    .card-pos { font-size:13px; color:var(--muted); margin-top:8px; }
    .card-back { margin-top:18px; padding-top:18px; border-top:1px dashed var(--border); }
    .card-answer { font-size:clamp(22px,4vw,30px); font-weight:700; }
    .card-note { font-size:13px; color:var(--muted); margin-top:8px; }
    .sess-top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; margin-bottom:14px; }
    .grades { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; }
    .grade { padding:14px; font-weight:700; }
    .grade.again { border-color:rgba(255,143,143,.5); color:var(--bad); }
    .grade.good { border-color:rgba(142,226,142,.5); color:var(--good); }
    .grade.easy { border-color:rgba(127,220,255,.5); color:#7fdcff; }
    .card-rating { margin-top:14px; font-size:13px; color:var(--muted); }
    .card-rating .stars { color:var(--accent); letter-spacing:2px; }
    .grade .gk { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; margin-right:7px; border-radius:5px; background:rgba(255,255,255,.10); font-size:11px; font-weight:700; vertical-align:middle; }
    .kbd-hint { text-align:center; color:var(--muted); font-size:12px; margin-top:12px; }
    kbd { display:inline-block; padding:1px 6px; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; background:var(--panel2); font-family:inherit; font-size:11px; color:var(--text); }
    .done { text-align:center; padding:50px 20px; }
    .done-tick { font-size:56px; color:var(--good); }
    .foot { color:var(--muted); font-size:13px; margin-top:18px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav"><a href="index.html">🏠 Home</a><a href="words.html">📖 Word list</a><a href="vocab.html">✎ Writing prompts</a><span style="color:var(--muted)">Flashcards</span></div>
    <h1>Vocabulary Flashcards</h1>
    <div id="root"></div>
  </div>

  <script src="greekvocab.data.js"></script>
  <script src="greekvocab.srsbridge.js"></script>
  <script src="greekvocab.backup.js"></script>
  <script>
  (function () {
    var STAGE_HOURS = [4, 8, 24, 72, 168, 336, 720, 1440], MASTER = STAGE_HOURS.length;
    var KEY = 'gvm_vocab_srs';
    var store = {};
    try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { store = {}; }
    if (!store.__settings) store.__settings = { dir: 'gr2en', newPerSession: 5 };
    store.__settings.newPerSession = 5; // learn 5 new per session
    function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

    // Deck = built-in vocab + user custom words (from the word-list page)
    var VOCAB = (window.VOCAB || []).slice();
    try { var t = JSON.parse(localStorage.getItem('gvm_vocab_track') || '{}'); if (Array.isArray(t.__custom)) { var have = {}; VOCAB.forEach(function (w) { have[w.gr] = 1; }); t.__custom.forEach(function (w) { if (w && w.gr && !have[w.gr]) VOCAB.push(w); }); } } catch (e) {}
    var byGr = {}; VOCAB.forEach(function (w) { byGr[w.gr] = w; });

    function rec(gr) { return store[gr]; }
    function isDue(gr) { var r = store[gr]; return !!r && r.stage < MASTER && (r.due || 0) <= Date.now(); }
    function dueList() { return VOCAB.filter(function (w) { return isDue(w.gr); }); }
    function inSrs(gr) { return !!store[gr]; }
    function newList() { return VOCAB.filter(function (w) { return !inSrs(w.gr); }); }
    function schedule(gr, grade) {
      var r = store[gr] || (store[gr] = { stage: 0, due: 0, seen: 0, correct: 0, last: null });
      r.seen += 1; r.last = Date.now();
      if (grade === 'again') { r.stage = Math.max(0, r.stage - 2); r.due = Date.now() + 3600000; }
      else { r.correct += 1; r.stage = Math.min(MASTER, r.stage + (grade === 'easy' ? 2 : 1)); r.due = Date.now() + STAGE_HOURS[Math.min(r.stage, STAGE_HOURS.length - 1)] * 3600000; }
      save();
      // Inter-relate with the word list: grading updates the word's 0-5 rating.
      if (window.GVSrsBridge) GVSrsBridge.writeRating(gr, GVSrsBridge.ratingFromStage(r.stage));
    }

    var root = document.getElementById('root'), session = null;
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function shuffle(a) { var c = a.slice(); for (var i = c.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = c[i]; c[i] = c[j]; c[j] = t; } return c; }

    function ratingLine(gr) {
      if (!window.GVSrsBridge) return '';
      var r = store[gr], rating = r ? GVSrsBridge.ratingFromStage(r.stage) : 0;
      var stars = '★★★★★'.slice(0, rating) + '☆☆☆☆☆'.slice(0, 5 - rating);
      return '<div class="card-rating">word-list rating: <span class="stars">' + stars + '</span> ' + rating + '/5</div>';
    }

    function render() { if (session) renderCard(); else renderDash(); }

    function renderDash() {
      var due = dueList().length, fresh = newList().length, dir = store.__settings.dir;
      var learned = VOCAB.length - fresh, mastered = VOCAB.filter(function (w) { var r = store[w.gr]; return r && r.stage >= MASTER; }).length;
      root.innerHTML =
        '<div class="hero"><div class="hero-num">' + due + '</div><div class="hero-label">cards due</div>' +
        '<div class="row"><button class="btn-primary" id="review"' + (due ? '' : ' disabled') + '>Review due</button>' +
        '<button id="learn"' + (fresh ? '' : ' disabled') + '>Learn ' + Math.min(store.__settings.newPerSession, fresh) + ' new</button></div></div>' +
        '<div class="toolbar"><span>Direction:</span>' +
        '<button class="' + (dir === 'gr2en' ? 'active' : '') + '" data-dir="gr2en">Greek → English</button>' +
        '<button class="' + (dir === 'en2gr' ? 'active' : '') + '" data-dir="en2gr">English → Greek</button></div>' +
        '<div class="summary">' + learned + ' in deck · ' + mastered + ' mastered · ' + fresh + ' not started · ' + VOCAB.length + ' total</div>' +
        '<div class="foot">Grading is tied to your word-list rating (0-5): “Again” lowers it, “Good”/“Easy” raise it, and rating a word in the word list seeds it here. Keys in a session: <kbd>Space</kbd> reveal, <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> grade, <kbd>Esc</kbd> end.</div>';
      var rv = document.getElementById('review'); if (rv) rv.addEventListener('click', function () { start(shuffle(dueList())); });
      var ln = document.getElementById('learn'); if (ln) ln.addEventListener('click', function () { start(shuffle(newList()).slice(0, store.__settings.newPerSession)); });
      root.querySelectorAll('[data-dir]').forEach(function (b) { b.addEventListener('click', function () { store.__settings.dir = b.getAttribute('data-dir'); save(); renderDash(); }); });
    }

    function start(cards) { if (!cards.length) return; session = { queue: cards.slice(), done: 0, total: cards.length, current: null, shown: false }; next(); }
    function next() { var s = session; if (!s.queue.length) { finish(); return; } s.current = s.queue.shift(); s.shown = false; render(); }
    function finish() { var n = session.done; session = null; root.innerHTML = '<div class="done"><div class="done-tick">✓</div><div style="font-size:24px;font-weight:700;margin-top:8px;">Session complete</div><div style="color:var(--muted);margin:8px 0 22px;">' + n + ' cards reviewed</div><button class="btn-primary" id="back">Back</button></div>'; document.getElementById('back').addEventListener('click', render); }

    function renderCard() {
      var s = session, w = s.current, dir = store.__settings.dir;
      var front = dir === 'gr2en' ? ((w.art ? w.art + ' ' : '') + w.gr) : w.en;
      var back = dir === 'gr2en' ? w.en : ((w.art ? w.art + ' ' : '') + w.gr);
      var html = '<div class="sess-top"><button id="quit">✕ end</button><span>' + (s.done + 1) + ' / ' + (s.done + 1 + s.queue.length) + '</span></div>' +
        '<div class="card"><div class="card-art">' + (dir === 'gr2en' ? 'What does this mean?' : 'How do you say this?') + '</div>' +
        '<div class="card-front">' + esc(front) + '</div>' +
        (dir === 'gr2en' ? '<div class="card-pos">' + esc(w.pos || '') + '</div>' : '') +
        (s.shown ? '<div class="card-back"><div class="card-answer">' + esc(back) + '</div>' + (w.note ? '<div class="card-note">' + esc(w.note) + '</div>' : '') + ratingLine(w.gr) + '</div>' : '') +
        '</div>';
      if (!s.shown) html += '<div class="row" style="margin-top:18px;"><button class="btn-primary" id="show" style="min-width:200px;">Show answer</button></div>' +
        '<div class="kbd-hint"><kbd>Space</kbd> reveal · <kbd>Esc</kbd> end</div>';
      else html += '<div class="grades">' +
        '<button class="grade again" data-g="again"><span class="gk">1</span>Again</button>' +
        '<button class="grade good" data-g="good"><span class="gk">2</span>Good</button>' +
        '<button class="grade easy" data-g="easy"><span class="gk">3</span>Easy</button></div>' +
        '<div class="kbd-hint"><kbd>1</kbd>/<kbd>a</kbd> again · <kbd>2</kbd>/<kbd>g</kbd> good · <kbd>3</kbd>/<kbd>e</kbd> easy · <kbd>Esc</kbd> end</div>';
      root.innerHTML = html;
      document.getElementById('quit').addEventListener('click', finish);
      if (!s.shown) document.getElementById('show').addEventListener('click', function () { s.shown = true; render(); });
      else root.querySelectorAll('[data-g]').forEach(function (b) { b.addEventListener('click', function () { schedule(w.gr, b.getAttribute('data-g')); s.done += 1; next(); }); });
    }

    function grade(g) { schedule(session.current.gr, g); session.done += 1; next(); }
    document.addEventListener('keydown', function (e) {
      if (!session) return;
      if (e.key === 'Escape') { e.preventDefault(); finish(); return; }
      if (!session.shown) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); session.shown = true; render(); }
        return;
      }
      // answer shown: 1/2/3 or a/g/e to grade
      if (/^[1-3]$/.test(e.key)) { e.preventDefault(); grade(['again', 'good', 'easy'][+e.key - 1]); }
      else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); grade('again'); }
      else if (e.key === 'g' || e.key === 'G') { e.preventDefault(); grade('good'); }
      else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); grade('easy'); }
    });

    // Seed the SRS deck from any 0-5 ratings set in the word list, so the two stay one system.
    if (window.GVSrsBridge) { var seeded = GVSrsBridge.seedInto(store); if (seeded) save(); }

    render();
    if (window.GVBackup) GVBackup.init();
  })();
  </script>
</body>
</html>
