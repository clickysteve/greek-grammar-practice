<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greek — Home</title>
  <link rel="stylesheet" href="suite.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, rgba(255,159,67,.08), transparent 28%), linear-gradient(180deg, #0f1114 0%, #171a1f 100%);
      color: var(--text); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    h1 { font-size: clamp(30px, 6vw, 48px); margin: 0; letter-spacing: -.04em; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .streak { text-align: right; }
    .streak-n { font-size: 30px; font-weight: 800; color: var(--accent); }
    .streak-l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

    .due-hero { border: 1px solid var(--border); border-radius: 22px; background: radial-gradient(circle at top, rgba(255,159,67,.10), transparent 55%), #12161b; padding: 22px; margin-bottom: 18px; text-align: center; }
    .due-num { font-size: 60px; font-weight: 800; line-height: 1; }
    .due-label { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; margin: 6px 0 14px; }
    .due-break { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .due-pill { border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--text); text-decoration: none; background: var(--panel2); }
    .due-pill:hover { border-color: var(--accent); }
    .due-pill b { color: var(--accent); }
    .due-pill.zero { opacity: .5; }

    .section-h { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 22px 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .card { display: block; text-decoration: none; color: var(--text); border: 1px solid var(--border); border-radius: 16px; background: var(--panel); padding: 16px; box-shadow: var(--shadow); transition: border-color .15s, transform .1s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-icon { font-size: 26px; }
    .card-title { font-weight: 700; font-size: 17px; margin: 8px 0 4px; }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.45; }
    .card-stat { font-size: 12px; color: var(--accent); margin-top: 8px; }

    .trouble { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); padding: 16px; }
    .trouble-empty { color: var(--muted); font-size: 14px; }
    .trouble-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,.08); text-decoration: none; color: var(--text); }
    .trouble-row:last-child { border-bottom: 0; }
    .trouble-type { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); min-width: 62px; text-align: center; }
    .trouble-type.verb { color: var(--present, #4ea1ff); }
    .trouble-type.grammar { color: var(--accent); }
    .trouble-type.vocab { color: #b78cff; }
    .trouble-label { flex: 1; font-weight: 600; }
    .trouble-sub { font-size: 12px; color: var(--bad); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div><h1>Γεια σου, Steve</h1><div class="sub">Your Greek practice hub</div></div>
      <div class="streak"><div class="streak-n" id="streakN">0</div><div class="streak-l">day streak</div></div>
    </div>

    <div class="due-hero">
      <div class="due-num" id="dueNum">0</div>
      <div class="due-label">reviews due now</div>
      <div class="due-break" id="dueBreak"></div>
    </div>

    <div class="section-h">Practice</div>
    <div class="grid" id="toolGrid"></div>

    <div class="section-h">Trouble spots — your weakest items</div>
    <div class="trouble" id="trouble"></div>
  </div>

  <script src="greeksuite.srs.js"></script>
  <script src="greekgrammar.data.js"></script>
  <script src="greekvocab.data.js"></script>
  <script src="greeksuite.stats.js"></script>
  <script>
  (function () {
    var S = window.GSStats;
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    var st = S.streak(); // read-only: only graded answers count as practice
    document.getElementById('streakN').textContent = st.days || 0;

    var v = S.verbs(), g = S.grammar(), o = S.vocab();
    var total = g.due + o.srsDue; // verbs are conjugation practice, not a learning-SRS — excluded here
    document.getElementById('dueNum').textContent = total;
    function pill(href, n, label) {
      return '<a class="due-pill' + (n ? '' : ' zero') + '" href="' + href + '"><b>' + n + '</b> ' + label + '</a>';
    }
    document.getElementById('dueBreak').innerHTML =
      pill('grammar.html', g.due, 'grammar') + pill('flashcards.html', o.srsDue, 'vocab');

    // Tool cards
    var grammarPts = (window.GRAMMAR || []).length;
    var tools = [
      { href: 'verbs.html', icon: '🔤', title: 'Verb practice', desc: 'Conjugation & tense drills across persons.', stat: v.rated ? (v.rated + ' cards rated · avg ' + (v.avg != null ? v.avg : '–') + '/5') : 'Start drilling verbs' },
      { href: 'grammar.html', icon: '🧩', title: 'Grammar', desc: grammarPts + ' lessons, A1–B2, with SRS reviews.', stat: g.lessonsRead ? (g.lessonsRead + ' lessons read · ' + g.mastered + ' mastered') : 'Begin the course' },
      { href: 'flashcards.html', icon: '🃏', title: 'Vocab flashcards', desc: 'Spaced-repetition recall for vocabulary.', stat: o.srsCount ? (o.srsCount + ' in SRS · ' + o.srsDue + ' due') : 'Build your deck' },
      { href: 'vocab.html', icon: '✎', title: 'Writing prompts', desc: 'Write using expressive + everyday words.', stat: 'Daily prompt inside' },
      { href: 'words.html', icon: '📖', title: 'Word list', desc: 'Browse, rate and add vocabulary.', stat: o.rated ? (o.rated + ' words rated') : 'Explore the pool' },
      { href: 'builder.html', icon: '🧱', title: 'Sentence builder', desc: 'Put scrambled Greek words in order.', stat: 'Word-order practice' },
      { href: 'micro.html', icon: '🔢', title: 'Micro trainers', desc: 'Numbers, time, dates and prices.', stat: 'Quick practical drills' },
      { href: 'stats.html', icon: '📊', title: 'Stats', desc: 'Progress and mastery across everything.', stat: 'See your numbers' }
    ];
    document.getElementById('toolGrid').innerHTML = tools.map(function (t) {
      return '<a class="card" href="' + t.href + '">' +
        '<div class="card-icon">' + t.icon + '</div>' +
        '<div class="card-title">' + t.title + '</div>' +
        '<div class="card-desc">' + t.desc + '</div>' +
        '<div class="card-stat">' + t.stat + '</div></a>';
    }).join('');

    // Trouble spots
    var grammarTitle = {}; (window.GRAMMAR || []).forEach(function (p) { grammarTitle[p.id] = p.title; });
    var vocabEn = {}; (window.VOCAB || []).forEach(function (w) { vocabEn[w.gr] = w.en; });
    var trouble = S.troubleSpots(12).map(function (t) {
      var label = t.label, sub = t.sub;
      if (t.type === 'grammar') label = grammarTitle[t.id] || t.label;
      if (t.type === 'vocab' && vocabEn[t.label]) label = t.label + ' — ' + vocabEn[t.label];
      return { type: t.type, label: label, sub: sub, href: t.href };
    });
    var el = document.getElementById('trouble');
    if (!trouble.length) {
      el.innerHTML = '<div class="trouble-empty">Nothing flagged yet. As you practise, the words and points you struggle with will surface here so you can target them.</div>';
    } else {
      el.innerHTML = trouble.map(function (t) {
        // label/sub derive from localStorage keys (imports can poison them) — escape.
        return '<a class="trouble-row" href="' + esc(t.href) + '">' +
          '<span class="trouble-type ' + esc(t.type) + '">' + esc(t.type) + '</span>' +
          '<span class="trouble-label">' + esc(t.label) + '</span>' +
          '<span class="trouble-sub">' + esc(t.sub) + '</span></a>';
      }).join('');
    }
  })();
  </script>
</body>
</html>
