<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greek — Sentence Builder</title>
  <style>
    :root { --bg:#111315; --panel:#1b1f24; --panel2:#232a31; --text:#eef2f7; --muted:#aab4c0; --border:#36404a; --accent:#ff9f43; --good:#8ee28e; --bad:#ff8f8f; --shadow:0 12px 34px rgba(0,0,0,.28); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at top,rgba(255,159,67,.08),transparent 28%),linear-gradient(180deg,#0f1114,#171a1f); color:var(--text); }
    .wrap { max-width:640px; margin:0 auto; padding:24px; }
    .nav { display:flex; gap:12px; margin-bottom:18px; font-size:14px; flex-wrap:wrap; }
    .nav a { color:var(--muted); text-decoration:none; border:1px solid var(--border); padding:7px 12px; border-radius:999px; background:var(--panel2); }
    .nav a:hover { color:var(--text); }
    h1 { font-size:clamp(24px,4vw,34px); margin:0 0 8px; letter-spacing:-.03em; }
    .sub { color:var(--muted); font-size:14px; margin-bottom:18px; }
    button { border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:10px; font-size:14px; padding:10px 14px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    .btn-primary { background:var(--accent); color:#1a1205; border-color:var(--accent); font-weight:700; }
    .card { border:1px solid var(--border); border-radius:24px; background:#12161b; padding:22px; }
    .prompt-en { font-size:18px; color:var(--muted); margin-bottom:16px; }
    .answer-zone { min-height:60px; border:1px dashed var(--border); border-radius:14px; padding:12px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; margin-bottom:14px; background:rgba(255,255,255,.02); }
    .answer-zone.ok { border-color:var(--good); border-style:solid; background:rgba(142,226,142,.08); }
    .answer-zone.bad { border-color:var(--bad); border-style:solid; background:rgba(255,143,143,.08); }
    .answer-zone:empty::before { content:'tap the words below in order…'; color:var(--muted); font-size:14px; }
    .bank { display:flex; flex-wrap:wrap; gap:8px; }
    .tile { font-size:18px; padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); cursor:pointer; user-select:none; }
    .tile:hover { border-color:var(--accent); }
    .tile.placed { font-weight:700; }
    .tile .tk { display:inline-block; min-width:15px; height:15px; line-height:15px; text-align:center; margin-right:7px; padding:0 3px; border-radius:4px; background:rgba(255,255,255,.10); font-size:10px; font-weight:700; color:var(--muted); vertical-align:middle; }
    .kbd-hint { text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
    kbd { display:inline-block; padding:1px 6px; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; background:var(--panel2); font-family:inherit; font-size:11px; color:var(--text); }
    .controls { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .feedback { margin-top:14px; font-weight:700; min-height:22px; }
    .feedback.ok { color:var(--good); } .feedback.bad { color:var(--bad); }
    .correct-line { color:var(--muted); font-size:15px; margin-top:6px; }
    .score { color:var(--muted); font-size:13px; margin-top:14px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav"><a href="index.html">🏠 Home</a><a href="grammar.html">🧩 Grammar</a><span style="color:var(--muted)">Sentence builder</span></div>
    <h1>Sentence Builder</h1>
    <div class="sub">Put the scrambled Greek words into the right order to match the English.</div>
    <div id="root"></div>
  </div>

  <script src="greekgrammar.data.js"></script>
  <script>
  (function () {
    // Build a pool of full Greek sentences from the grammar items.
    var pool = [];
    (window.GRAMMAR || []).forEach(function (p) {
      p.items.forEach(function (it) {
        var raw = it.text.replace(/\s*\([^)]+\)\s*$/, '');           // drop trailing cue
        var full = raw.replace('{b}', it.answer).replace(/\s+/g, ' ').trim();
        var words = full.split(' ');
        if (words.length >= 4 && words.length <= 11 && it.answer.indexOf(' ') === -1) {
          pool.push({ words: words, en: it.en, full: full });
        }
      });
    });

    var root = document.getElementById('root');
    var state = { q: null, placed: [], bank: [], checked: false, score: 0, n: 0 };
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function shuffle(a) { var c = a.slice(); for (var i = c.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = c[i]; c[i] = c[j]; c[j] = t; } return c; }

    function newQuestion() {
      state.q = pool[Math.floor(Math.random() * pool.length)];
      state.placed = [];
      // bank holds {word, id} so duplicate words stay distinct
      state.bank = shuffle(state.q.words.map(function (w, i) { return { word: w, id: i }; }));
      // avoid an accidentally-correct shuffle
      if (state.bank.map(function (t) { return t.word; }).join(' ') === state.q.full) state.bank = shuffle(state.bank);
      state.checked = false;
      render();
    }

    function render() {
      var q = state.q;
      var zoneCls = state.checked ? (state.ok ? ' ok' : ' bad') : '';
      var placed = state.placed.map(function (t) { return '<span class="tile placed" data-place="' + t.id + '">' + esc(t.word) + '</span>'; }).join('');
      var bank = state.bank.map(function (t, i) { return '<span class="tile" data-bank="' + t.id + '">' + (i < 9 ? '<span class="tk">' + (i + 1) + '</span>' : '') + esc(t.word) + '</span>'; }).join('');
      var hint = state.checked
        ? '<kbd>Enter</kbd> next'
        : '<kbd>1</kbd>–<kbd>9</kbd> place · <kbd>Backspace</kbd> remove · <kbd>Enter</kbd> check · <kbd>C</kbd> clear';
      root.innerHTML =
        '<div class="card"><div class="prompt-en">' + esc(q.en) + '</div>' +
        '<div class="answer-zone' + zoneCls + '" id="zone">' + placed + '</div>' +
        '<div class="bank" id="bank">' + bank + '</div>' +
        '<div class="feedback ' + (state.checked ? (state.ok ? 'ok' : 'bad') : '') + '">' +
          (state.checked ? (state.ok ? '✓ Correct!' : '✗ Not quite') : '') +
          (state.checked && !state.ok ? '<div class="correct-line">' + esc(q.full) + '</div>' : '') + '</div>' +
        '<div class="controls">' +
          (state.checked ? '<button class="btn-primary" id="nextBtn">Next →</button>' :
            '<button class="btn-primary" id="checkBtn"' + (state.placed.length === q.words.length ? '' : ' disabled') + '>Check</button><button id="clearBtn">Clear</button>') +
        '</div>' +
        '<div class="kbd-hint">' + hint + '</div></div>' +
        '<div class="score">' + state.score + ' / ' + state.n + ' correct</div>';

      root.querySelectorAll('[data-bank]').forEach(function (b) { b.addEventListener('click', function () {
        if (state.checked) return; placeById(+b.getAttribute('data-bank'));
      }); });
      root.querySelectorAll('[data-place]').forEach(function (b) { b.addEventListener('click', function () {
        if (state.checked) return; unplaceById(+b.getAttribute('data-place'));
      }); });
      var cb = document.getElementById('checkBtn'); if (cb) cb.addEventListener('click', check);
      var clb = document.getElementById('clearBtn'); if (clb) clb.addEventListener('click', doClear);
      var nb = document.getElementById('nextBtn'); if (nb) nb.addEventListener('click', newQuestion);
    }

    function placeById(id) { var i = state.bank.findIndex(function (t) { return t.id === id; }); if (i > -1) { state.placed.push(state.bank.splice(i, 1)[0]); render(); } }
    function unplaceById(id) { var i = state.placed.findIndex(function (t) { return t.id === id; }); if (i > -1) { state.bank.push(state.placed.splice(i, 1)[0]); render(); } }
    function unplaceLast() { if (state.placed.length) { state.bank.push(state.placed.pop()); render(); } }
    function doClear() { state.bank = state.bank.concat(state.placed); state.placed = []; render(); }

    function check() {
      var attempt = state.placed.map(function (t) { return t.word; }).join(' ');
      state.ok = attempt === state.q.full;
      state.checked = true; state.n += 1; if (state.ok) state.score += 1;
      render();
    }

    document.addEventListener('keydown', function (e) {
      if (!state.q) return;
      if (state.checked) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); newQuestion(); } return; }
      if (/^[1-9]$/.test(e.key)) { var i = +e.key - 1; if (i < state.bank.length) { e.preventDefault(); placeById(state.bank[i].id); } }
      else if (e.key === 'Backspace') { e.preventDefault(); unplaceLast(); }
      else if (e.key === 'Enter') { if (state.placed.length === state.q.words.length) { e.preventDefault(); check(); } }
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') { e.preventDefault(); doClear(); }
    });

    if (!pool.length) { root.innerHTML = '<div style="color:var(--muted)">No sentences available.</div>'; return; }
    newQuestion();
  })();
  </script>
</body>
</html>
