<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greek — Micro Trainers</title>
  <link rel="stylesheet" href="suite.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at top,rgba(255,159,67,.08),transparent 28%),linear-gradient(180deg,#0f1114,#171a1f); color:var(--text); }
    .wrap { max-width:600px; margin:0 auto; padding:24px; }
    h1 { font-size:clamp(24px,4vw,34px); margin:0 0 14px; letter-spacing:-.03em; }
    button { border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:10px; font-size:14px; padding:10px 14px; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .tab { font-size:14px; }
    .tab.active { outline:2px solid rgba(255,159,67,.45); color:var(--text); background:rgba(255,159,67,.08); }
    .card { border:1px solid var(--border); border-radius:24px; background:#12161b; padding:30px 22px; text-align:center; }
    .q-label { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
    .q-main { font-size:clamp(40px,9vw,72px); font-weight:800; letter-spacing:-.03em; margin:10px 0 6px; }
    .q-main.small { font-size:clamp(20px,4.5vw,30px); font-weight:600; letter-spacing:-.01em; line-height:1.35; }
    .q-sub { font-size:14px; color:var(--muted); }
    .swatch { display:inline-block; width:120px; height:120px; border-radius:18px; border:2px solid var(--border); box-shadow:inset 0 0 0 1px rgba(0,0,0,.2); }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
    .choice { font-size:18px; padding:14px; }
    .choice.correct { border-color:var(--good); color:var(--good); }
    .choice.wrong { border-color:var(--bad); color:var(--bad); }
    .choice .ck { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; margin-right:8px; border-radius:5px; background:rgba(255,255,255,.10); font-size:11px; font-weight:700; vertical-align:middle; }
    .kbd-hint { text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
    kbd { display:inline-block; padding:1px 6px; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; background:var(--panel2); font-family:inherit; font-size:11px; color:var(--text); }
    .next { margin-top:16px; }
    .score { color:var(--muted); font-size:13px; margin-top:16px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav"><a href="index.html">Home</a><a href="verbs.html">Verbs</a><a href="grammar.html">Grammar</a><a href="flashcards.html">Flashcards</a><a href="vocab.html">Writing</a><a href="words.html">Words</a><a href="builder.html">Builder</a><span class="here">Micro</span><a href="stats.html">Stats</a></div>
    <h1>Micro Trainers</h1>
    <div class="tabs" id="tabs"></div>
    <div id="root"></div>
    <div class="score" id="score"></div>
  </div>

  <script>
  (function () {
    var units = ['μηδέν', 'ένα', 'δύο', 'τρία', 'τέσσερα', 'πέντε', 'έξι', 'εφτά', 'οχτώ', 'εννιά'];
    var teens = ['έντεκα', 'δώδεκα', 'δεκατρία', 'δεκατέσσερα', 'δεκαπέντε', 'δεκαέξι', 'δεκαεφτά', 'δεκαοχτώ', 'δεκαεννιά'];
    var tens = { 20: 'είκοσι', 30: 'τριάντα', 40: 'σαράντα', 50: 'πενήντα', 60: 'εξήντα', 70: 'εβδομήντα', 80: 'ογδόντα', 90: 'ενενήντα' };
    function grNum(n) {
      if (n < 10) return units[n];
      if (n === 10) return 'δέκα';
      if (n < 20) return teens[n - 11];
      if (n === 100) return 'εκατό';
      var t = Math.floor(n / 10) * 10, u = n % 10;
      return tens[t] + (u ? ' ' + units[u] : '');
    }
    var clockHours = ['', 'μία', 'δύο', 'τρεις', 'τέσσερις', 'πέντε', 'έξι', 'εφτά', 'οχτώ', 'εννιά', 'δέκα', 'έντεκα', 'δώδεκα'];
    var days = [['Monday', 'Δευτέρα'], ['Tuesday', 'Τρίτη'], ['Wednesday', 'Τετάρτη'], ['Thursday', 'Πέμπτη'], ['Friday', 'Παρασκευή'], ['Saturday', 'Σάββατο'], ['Sunday', 'Κυριακή']];
    var months = [['January', 'Ιανουάριος'], ['February', 'Φεβρουάριος'], ['March', 'Μάρτιος'], ['April', 'Απρίλιος'], ['May', 'Μάιος'], ['June', 'Ιούνιος'], ['July', 'Ιούλιος'], ['August', 'Αύγουστος'], ['September', 'Σεπτέμβριος'], ['October', 'Οκτώβριος'], ['November', 'Νοέμβριος'], ['December', 'Δεκέμβριος']];

    // [noun, article] — singular nouns with their gender (ο masc, η fem, το neut)
    var NOUNS = [
      ['άντρας', 'ο'], ['φίλος', 'ο'], ['καφές', 'ο'], ['δρόμος', 'ο'], ['ουρανός', 'ο'], ['ήλιος', 'ο'], ['καιρός', 'ο'], ['δάσκαλος', 'ο'], ['γιατρός', 'ο'], ['σκύλος', 'ο'], ['κήπος', 'ο'], ['χρόνος', 'ο'], ['μήνας', 'ο'], ['άνθρωπος', 'ο'],
      ['γυναίκα', 'η'], ['φίλη', 'η'], ['θάλασσα', 'η'], ['πόλη', 'η'], ['καρδιά', 'η'], ['μέρα', 'η'], ['νύχτα', 'η'], ['ώρα', 'η'], ['δουλειά', 'η'], ['αγάπη', 'η'], ['μητέρα', 'η'], ['γλώσσα', 'η'], ['χώρα', 'η'], ['πόρτα', 'η'],
      ['σπίτι', 'το'], ['παιδί', 'το'], ['νερό', 'το'], ['βιβλίο', 'το'], ['αυτοκίνητο', 'το'], ['τραπέζι', 'το'], ['δέντρο', 'το'], ['ψωμί', 'το'], ['κρασί', 'το'], ['γάλα', 'το'], ['φαγητό', 'το'], ['παράθυρο', 'το'], ['λουλούδι', 'το'], ['βουνό', 'το']
    ];
    // [name, hex]
    var COLOURS = [
      ['κόκκινο', '#e53935'], ['μπλε', '#1e88e5'], ['πράσινο', '#43a047'], ['κίτρινο', '#fdd835'], ['πορτοκαλί', '#fb8c00'],
      ['μωβ', '#8e24aa'], ['ροζ', '#ec407a'], ['καφέ', '#6d4c41'], ['μαύρο', '#212121'], ['άσπρο', '#fafafa'], ['γκρι', '#9e9e9e'], ['γαλάζιο', '#4fc3f7']
    ];
    // [singular, plural, [3 plausible-but-wrong forms]] — distractors kept >=2 edits apart
    var PLURALS = [
      ['ο φίλος', 'οι φίλοι', ['οι φίλες', 'τα φίλα', 'οι φίλους']],
      ['το βιβλίο', 'τα βιβλία', ['οι βιβλίες', 'οι βιβλίοι', 'οι βιβλιάδες']],
      ['η γυναίκα', 'οι γυναίκες', ['οι γυναίκοι', 'τα γυναίκα', 'οι γυναικάδες']],
      ['το παιδί', 'τα παιδιά', ['οι παιδές', 'οι παιδοί', 'οι παιδιά']],
      ['το πρόβλημα', 'τα προβλήματα', ['οι προβλήμες', 'τα προβλήμια', 'οι προβλήμοι']],
      ['ο άντρας', 'οι άντρες', ['οι άντροι', 'τα άντρα', 'οι αντράδες']],
      ['η πόλη', 'οι πόλεις', ['οι πόλοι', 'τα πόλια', 'οι πόληδες']],
      ['ο μαθητής', 'οι μαθητές', ['οι μαθητοί', 'οι μαθητάδες', 'τα μαθητά']],
      ['το τραπέζι', 'τα τραπέζια', ['οι τραπέζες', 'οι τραπεζοί', 'τα τραπέζη']],
      ['η μέρα', 'οι μέρες', ['οι μέροι', 'τα μέρα', 'οι μεράδες']],
      ['ο δρόμος', 'οι δρόμοι', ['οι δρόμες', 'τα δρόμα', 'οι δρομάδες']],
      ['η καρδιά', 'οι καρδιές', ['οι καρδιοί', 'τα καρδιά', 'οι καρδιάδες']],
      ['το σπίτι', 'τα σπίτια', ['οι σπίτες', 'οι σπιτοί', 'τα σπίτη']],
      ['ο καφές', 'οι καφέδες', ['οι καφέ', 'οι καφέδια', 'οι καφέοι']],
      ['η εφημερίδα', 'οι εφημερίδες', ['οι εφημερίδοι', 'τα εφημερίδα', 'οι εφημεριδάδες']],
      ['το μάθημα', 'τα μαθήματα', ['οι μαθήμες', 'τα μαθήμια', 'οι μαθήμοι']],
      ['ο άνθρωπος', 'οι άνθρωποι', ['οι άνθρωπες', 'τα άνθρωπα', 'οι ανθρώπια']],
      ['η γλώσσα', 'οι γλώσσες', ['οι γλώσσοι', 'τα γλώσσα', 'οι γλωσσάδες']]
    ];
    // Usage of indefinite/determiner words — which word fits the context.
    // Distractors are in the SAME form as the answer, so only the MEANING is tested.
    var USAGE = [
      { gr: 'Δεν έχω ξαναδεί ___ ομορφιά!', en: 'I’ve never seen such beauty!', a: 'τέτοια', c: ['τέτοια', 'κάποια', 'άλλη', 'ίδια'] },
      { gr: '___ μέρα θα γίνεις διάσημος.', en: 'Some day you’ll be famous.', a: 'Κάποια', c: ['Κάποια', 'Τέτοια', 'Άλλη', 'Ίδια'] },
      { gr: 'Θέλω ___ καφέ· αυτός κρύωσε.', en: 'I want another coffee; this one got cold.', a: 'άλλον', c: ['άλλον', 'κάποιον', 'τέτοιον', 'ίδιο'] },
      { gr: 'Φοράμε τα ___ παπούτσια!', en: 'We’re wearing the same shoes!', a: 'ίδια', c: ['ίδια', 'άλλα', 'κάποια', 'τέτοια'] },
      { gr: '___ θέλει, ας έρθει.', en: 'Whoever wants to can come.', a: 'Όποιος', c: ['Όποιος', 'Κάποιος', 'Άλλος', 'Κανένας'] },
      { gr: '___ μέρα πηγαίνω γυμναστήριο.', en: 'Every day I go to the gym.', a: 'Κάθε', c: ['Κάθε', 'Κάποια', 'Άλλη', 'Τέτοια'] },
      { gr: 'Ήρθαν ___ οι φίλοι μου.', en: 'All my friends came.', a: 'όλοι', c: ['όλοι', 'κάποιοι', 'άλλοι', 'μερικοί'] },
      { gr: 'Ξέρει ___ την απάντηση;', en: 'Does anyone know the answer?', a: 'κανείς', c: ['κανείς', 'κάποιος', 'άλλος', 'καθένας'] },
      { gr: 'Αγόρασα ___ μήλα, όχι πολλά.', en: 'I bought a few apples, not many.', a: 'μερικά', c: ['μερικά', 'όλα', 'άλλα', 'τέτοια'] },
      { gr: 'Υπάρχει ___ πρόβλημα με το αυτοκίνητο.', en: 'There’s some problem with the car.', a: 'κάποιο', c: ['κάποιο', 'τέτοιο', 'άλλο', 'ίδιο'] },
      { gr: 'Ποτέ μην εμπιστεύεσαι ___ ανθρώπους.', en: 'Never trust such people.', a: 'τέτοιους', c: ['τέτοιους', 'κάποιους', 'άλλους', 'ίδιους'] },
      { gr: 'Θα το ξανακάνουμε ___ φορά.', en: 'We’ll do it another time.', a: 'άλλη', c: ['άλλη', 'κάποια', 'τέτοια', 'ίδια'] },
      { gr: 'Πάρε ___ θέλεις.', en: 'Take whichever you want.', a: 'όποιο', c: ['όποιο', 'κάποιο', 'άλλο', 'τέτοιο'] },
      { gr: 'Όλοι έφυγαν· δεν έμεινε ___.', en: 'Everyone left; nobody stayed.', a: 'κανείς', c: ['κανείς', 'κάποιος', 'άλλος', 'καθένας'] },
      { gr: 'Έχει ___ δίκιο σ’ αυτό.', en: 'He’s somewhat right about this.', a: 'κάποιο', c: ['κάποιο', 'τέτοιο', 'άλλο', 'ίδιο'] }
    ];

    function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
    function shuffle(a) { var c = a.slice(); for (var i = c.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = c[i]; c[i] = c[j]; c[j] = t; } return c; }
    function pickDistinct(genAnswer, correct, n) { var s = [correct]; var guard = 0; while (s.length < n && guard++ < 100) { var x = genAnswer(); if (s.indexOf(x) === -1) s.push(x); } return shuffle(s); }

    var MODES = {
      numbers: function () {
        var n = rint(0, 99); var ans = grNum(n);
        return { label: 'number', main: String(n), sub: '', answer: ans, choices: pickDistinct(function () { return grNum(rint(0, 99)); }, ans, 4) };
      },
      time: function () {
        var h = rint(1, 12), m = [0, 15, 30, 45][rint(0, 3)];
        var disp = h + ':' + (m < 10 ? '0' + m : m);
        var ans;
        if (m === 0) ans = clockHours[h];
        else if (m === 30) ans = clockHours[h] + ' και μισή';
        else if (m === 15) ans = clockHours[h] + ' και τέταρτο';
        else ans = clockHours[h === 12 ? 1 : h + 1] + ' παρά τέταρτο';
        return { label: 'what time?', main: disp, sub: '', answer: ans, choices: pickDistinct(function () {
          var hh = rint(1, 12), mm = [0, 15, 30, 45][rint(0, 3)];
          if (mm === 0) return clockHours[hh];
          if (mm === 30) return clockHours[hh] + ' και μισή';
          if (mm === 15) return clockHours[hh] + ' και τέταρτο';
          return clockHours[hh === 12 ? 1 : hh + 1] + ' παρά τέταρτο';
        }, ans, 4) };
      },
      days: function () {
        var pick = Math.random() < 0.5 ? days : months;
        var item = pick[rint(0, pick.length - 1)];
        return { label: 'say it in Greek', main: item[0], sub: pick === days ? 'day' : 'month', answer: item[1], choices: pickDistinct(function () { return pick[rint(0, pick.length - 1)][1]; }, item[1], 4) };
      },
      prices: function () {
        var e = rint(1, 40), c = Math.random() < 0.5 ? 50 : 0;
        var disp = '€' + e + (c ? '.50' : '.00');
        var ans = grNum(e) + ' ευρώ' + (c ? ' και πενήντα' : '');
        return { label: 'how much?', main: disp, sub: '', answer: ans, choices: pickDistinct(function () { var ee = rint(1, 40), cc = Math.random() < 0.5 ? 50 : 0; return grNum(ee) + ' ευρώ' + (cc ? ' και πενήντα' : ''); }, ans, 4) };
      },
      gender: function () {
        var w = NOUNS[rint(0, NOUNS.length - 1)];
        return { label: 'which article?', main: w[0], sub: 'ο / η / το', answer: w[1], choices: shuffle(['ο', 'η', 'το']) };
      },
      colours: function () {
        var c = COLOURS[rint(0, COLOURS.length - 1)];
        return { label: 'which colour?', main: '', swatch: c[1], sub: '', answer: c[0], choices: pickDistinct(function () { return COLOURS[rint(0, COLOURS.length - 1)][0]; }, c[0], 4) };
      },
      plurals: function () {
        var p = PLURALS[rint(0, PLURALS.length - 1)];
        return { label: 'plural of…', main: p[0], sub: '', answer: p[1], choices: shuffle([p[1]].concat(p[2])) };
      },
      usage: function () {
        var it = USAGE[rint(0, USAGE.length - 1)];
        return { label: it.en, main: it.gr, small: true, sub: 'which word fits?', answer: it.a, choices: shuffle(it.c) };
      }
    };
    var MODE_LABELS = { numbers: 'Numbers', time: 'Time', days: 'Days & months', prices: 'Prices', gender: 'Gender ο/η/το', colours: 'Colours', plurals: 'Plurals', usage: 'τέτοιος/κάποιος' };

    var mode = 'numbers', q = null, answered = false, chosen = null, score = 0, n = 0;
    var root = document.getElementById('root');
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    document.getElementById('tabs').innerHTML = Object.keys(MODES).map(function (k) {
      return '<button class="tab' + (k === mode ? ' active' : '') + '" data-m="' + k + '">' + MODE_LABELS[k] + '</button>';
    }).join('');
    document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () {
      mode = b.getAttribute('data-m'); score = 0; n = 0;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x === b); });
      nextQ();
    }); });

    function nextQ() { q = MODES[mode](); answered = false; chosen = null; render(); }
    function choose(c) {
      if (answered) return;
      answered = true; chosen = c; n += 1;
      if (c === q.answer) score += 1;
      render();
    }
    function render() {
      var html = '<div class="card"><div class="q-label">' + q.label + '</div>' +
        '<div class="q-main' + (q.small ? ' small' : '') + '">' + (q.swatch ? '<span class="swatch" style="background:' + q.swatch + '"></span>' : esc(q.main)) + '</div>' + (q.sub ? '<div class="q-sub">' + esc(q.sub) + '</div>' : '') +
        '<div class="choices">' + q.choices.map(function (c, i) {
          var cls = ''; if (answered) { if (c === q.answer) cls = ' correct'; else if (c === chosen) cls = ' wrong'; }
          return '<button class="choice' + cls + '" data-c="' + esc(c) + '"><span class="ck">' + (i + 1) + '</span>' + esc(c) + '</button>';
        }).join('') + '</div>' +
        (answered ? '<button class="btn-primary next" id="next" style="background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:700;">Next →</button>' : '') +
        '<div class="kbd-hint">' + (answered ? '<kbd>Enter</kbd> next' : '<kbd>1</kbd>–<kbd>4</kbd> answer') + '</div>' +
        '</div>';
      root.innerHTML = html;
      document.getElementById('score').textContent = score + ' / ' + n + ' correct';
      if (!answered) root.querySelectorAll('[data-c]').forEach(function (b) { b.addEventListener('click', function () { choose(b.getAttribute('data-c')); }); });
      else document.getElementById('next').addEventListener('click', nextQ);
    }

    document.addEventListener('keydown', function (e) {
      if (!q) return;
      if (answered) { if (e.key === 'Enter' || e.key === ' ' || e.key === 'n') { e.preventDefault(); nextQ(); } return; }
      if (/^[1-4]$/.test(e.key)) { var i = +e.key - 1; if (i < q.choices.length) { e.preventDefault(); choose(q.choices[i]); } }
    });

    nextQ();
  })();
  </script>
</body>
</html>
